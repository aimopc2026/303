<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>星语心愿</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(to bottom, #0a0a1a 0%, #1a1a3e 50%, #2d1b4e 100%);
            min-height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .center-star {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.5s ease;
        }
        
        .center-star .star-icon {
            font-size: 60px;
            opacity: 0.3;
            animation: pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.6; }
        }
        
        .center-star .hint-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-top: 15px;
            letter-spacing: 2px;
        }
        
        .star-task {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .star-task:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
        }
        
        .star-task.completed {
            background: rgba(255, 215, 0, 0.3);
            border-color: rgba(255, 215, 0, 0.6);
            animation: glow 1.5s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
            50% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.6); }
        }
        
        .star-task .icon {
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .star-task .label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 11px;
        }
        
        #memory-star { top: 20%; left: 20%; }
        #time-star { top: 15%; right: 25%; }
        #love-star { bottom: 25%; left: 50%; transform: translateX(-50%); }
        
        .message-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 300px;
            z-index: 100;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .message-popup.show {
            transform: translate(-50%, -50%) scale(1);
        }
        
        .message-popup .heart {
            font-size: 40px;
            margin-bottom: 15px;
            animation: heartbeat 1s ease-in-out infinite;
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .message-popup .text {
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .message-popup .close-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }
        
        .message-popup .close-btn:hover {
            transform: scale(1.05);
        }
        
        .final-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            transition: opacity 2s ease;
        }
        
        .final-message.show {
            opacity: 1;
            pointer-events: auto;
        }
        
        .final-message .rose {
            font-size: 100px;
            margin-bottom: 20px;
            animation: rose-float 3s ease-in-out infinite;
        }
        
        @keyframes rose-float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        
        .final-message .text {
            color: white;
            font-size: 22px;
            line-height: 1.8;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }
        
        .final-message .restart-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 12px 40px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        
        .final-message .restart-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
        }
        
        .progress-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff6b6b);
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="ui-layer">
        <div class="center-star" id="center-star">
            <div class="star-icon">✦</div>
            <div class="hint-text">这颗星，缺了点什么...</div>
        </div>
        
        <div class="star-task hidden" id="memory-star" data-task="memory">
            <div class="icon">💫</div>
            <div class="label">记忆星</div>
        </div>
        
        <div class="star-task hidden" id="time-star" data-task="time">
            <div class="icon">🌙</div>
            <div class="label">时光星</div>
        </div>
        
        <div class="star-task hidden" id="love-star" data-task="love">
            <div class="icon">✨</div>
            <div class="label">告白星</div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
    </div>
    
    <div class="message-popup" id="popup">
        <div class="heart">💖</div>
        <div class="text" id="popup-text"></div>
        <button class="close-btn" onclick="closePopup()">继续</button>
    </div>
    
    <div class="final-message" id="final-message">
        <div class="rose">🌹</div>
        <div class="text">
            遇见你之前，我以为星空就是最美的风景<br>
            遇见你之后，才发现你眼里的光比星星更亮<br>
            这颗心，只为你而跳动
        </div>
        <button class="restart-btn" onclick="location.reload()">再看一次</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // 设置画布大小
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        
        // 星星类
        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.brightness = Math.random();
                this.twinkleSpeed = Math.random() * 0.02 + 0.01;
            }
            
            draw() {
                this.brightness += this.twinkleSpeed;
                const alpha = (Math.sin(this.brightness) + 1) / 2 * 0.8 + 0.2;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
                
                // 光晕
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.2})`;
                ctx.fill();
            }
        }
        
        // 创建背景星星
        const stars = [];
        for (let i = 0; i < 150; i++) {
            stars.push(new Star());
        }
        
        // 流星类
        class ShootingStar {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = 0;
                this.length = Math.random() * 80 + 20;
                this.speed = Math.random() * 10 + 5;
                this.angle = Math.PI / 4;
                this.opacity = 1;
                this.active = false;
            }
            
            update() {
                if (!this.active) {
                    if (Math.random() < 0.005) {
                        this.active = true;
                    }
                    return;
                }
                
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.opacity -= 0.01;
                
                if (this.opacity <= 0 || this.x > canvas.width || this.y > canvas.height) {
                    this.reset();
                }
            }
            
            draw() {
                if (!this.active) return;
                
                const tailX = this.x - Math.cos(this.angle) * this.length;
                const tailY = this.y - Math.sin(this.angle) * this.length;
                
                const gradient = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
                gradient.addColorStop(1, `rgba(255, 255, 255, 0)`);
                
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(tailX, tailY);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
        
        const shootingStars = [new ShootingStar(), new ShootingStar()];
        
        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景星星
            stars.forEach(star => star.draw());
            
            // 绘制流星
            shootingStars.forEach(star => {
                star.update();
                star.draw();
            });
            
            requestAnimationFrame(animate);
        }
        animate();
        
        // 游戏状态
        let completedTasks = 0;
        const totalTasks = 3;
        
        // 任务配置
        const taskMessages = {
            memory: {
                icon: '💫',
                title: '记忆星',
                message: '记得我们第一次相遇的那天<br>阳光正好，微风不燥<br>你的笑容，比阳光更暖'
            },
            time: {
                icon: '🌙',
                title: '时光星',
                message: '想和你虚度时光<br>比如低头看鱼，比如把茶杯留在桌上<br>离开，浪费它们好看的阴影'
            },
            love: {
                icon: '✨',
                title: '告白星',
                message: '其实我想对你说<br>遇见你，是我这辈子最美的意外<br>余生很长，想和你一起浪费'
            }
        };
        
        // 中心星星点击
        document.getElementById('center-star').addEventListener('click', function() {
            this.classList.add('hidden');
            document.querySelectorAll('.star-task').forEach(task => {
                task.classList.remove('hidden');
            });
        });
        
        // 任务星星点击
        document.querySelectorAll('.star-task').forEach(task => {
            task.addEventListener('click', function() {
                if (this.classList.contains('completed')) return;
                
                const taskType = this.dataset.task;
                const config = taskMessages[taskType];
                
                showPopup(config.message);
                
                this.classList.add('completed');
                completedTasks++;
                
                // 更新进度条
                document.getElementById('progress').style.width = 
                    (completedTasks / totalTasks * 100) + '%';
                
                // 检查是否全部完成
                if (completedTasks === totalTasks) {
                    setTimeout(showFinal, 1500);
                }
            });
        });
        
        // 显示弹窗
        function showPopup(text) {
            document.getElementById('popup-text').innerHTML = text;
            document.getElementById('popup').classList.add('show');
        }
        
        // 关闭弹窗
        function closePopup() {
            document.getElementById('popup').classList.remove('show');
        }
        
        // 显示最终画面
        function showFinal() {
            document.querySelector('.ui-layer').classList.add('hidden');
            document.querySelector('.progress-bar').classList.add('hidden');
            
            // 绘制玫瑰动画
            drawRoseAnimation();
            
            setTimeout(() => {
                document.getElementById('final-message').classList.add('show');
            }, 3000);
        }
        
        // 玫瑰动画
        function drawRoseAnimation() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            let progress = 0;
            
            function drawFrame() {
                if (progress > 1) return;
                
                ctx.save();
                ctx.translate(centerX, centerY);
                
                // 绘制玫瑰轮廓
                ctx.beginPath();
                for (let i = 0; i < 360 * progress; i++) {
                    const angle = i * Math.PI / 180;
                    const r = 100 * Math.sin(4 * angle);
                    const x = r * Math.cos(angle) * (0.5 + progress * 0.5);
                    const y = r * Math.sin(angle) * (0.5 + progress * 0.5);
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 100);
                gradient.addColorStop(0, `rgba(255, 100, 100, ${progress})`);
                gradient.addColorStop(0.5, `rgba(255, 50, 50, ${progress * 0.8})`);
                gradient.addColorStop(1, `rgba(200, 0, 0, ${progress * 0.5})`);
                
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.strokeStyle = `rgba(255, 200, 200, ${progress})`;
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.restore();
                
                progress += 0.01;
                requestAnimationFrame(drawFrame);
            }
            
            drawFrame();
        }
    </script>
</body>
</html>
